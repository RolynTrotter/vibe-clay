name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No dependencies to install — the engine is dependency-free by design and
      # the tests run on node's built-in runner.
      - run: npm test
      - name: Skill version matches package.json
        run: npm run check:version
