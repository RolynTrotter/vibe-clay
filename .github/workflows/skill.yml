name: Skill zip

# Builds and tests the uploadable skill zip on every push and PR, and keeps it
# as a build artifact so an untagged main is still downloadable. (Downloading
# the repo's own "Code → Download ZIP" gives you the source tree, which has
# five SKILL.md files and won't upload.)
#
# Publishing is NOT here: `release.yml` cuts the tag and attaches the zip when
# a merge to main changes the version. This workflow deliberately does not run
# on tags, because the tag is now created BY that release — reacting to it
# would publish the same zip twice.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test the zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20, not the latest: the bundle claims to run on 18+, and 22+ would
      # hide a missing "type": "module" by auto-detecting ES modules.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Build the zip
        run: node tools/build-skill.mjs

      - name: Check it's uploadable and the engine runs
        run: node tools/test-skill.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: vibe-clay-skill-${{ steps.version.outputs.version }}
          path: dist/vibe-clay-*.zip
          if-no-files-found: error
